<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070b">
  <title>Frosty's Modding</title>
  <style>
    :root {
      --bg: #070609;
      --card: #1b1924;
      --card-hover: #24202f;
      --purple: #c65cff;
      --purple-soft: #a84ee8;
      --text: #f5f2f8;
      --muted: #aaa5b5;
      --border: #373044;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 4%, rgba(142, 47, 185, .13), transparent 33rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      top: -10vh;
      bottom: -10vh;
      width: 11vw;
      pointer-events: none;
      opacity: .32;
      border-color: #35213f;
      border-style: solid;
      filter: drop-shadow(0 0 8px rgba(178, 67, 255, .12));
    }
    body::before {
      left: -5vw;
      border-width: 0 2px 0 0;
      transform: skew(-13deg);
    }
    body::after {
      right: -5vw;
      border-width: 0 0 0 2px;
      transform: skew(13deg);
    }
    main {
      width: min(100% - 32px, 590px);
      margin: 0 auto;
      padding: 34px 0 48px;
      position: relative;
      z-index: 1;
    }
    header { text-align: center; margin-bottom: 34px; }
    .logo {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      border-radius: 50%;
      border: 3px solid var(--purple);
      background: linear-gradient(145deg, #25102f, #100d17 70%);
      box-shadow: 0 0 32px rgba(190, 70, 255, .24), inset 0 0 18px rgba(190, 70, 255, .12);
      color: #fff;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: -2px;
    }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 36px); letter-spacing: -.8px; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .links { display: grid; gap: 16px; }
    .link-card {
      display: block;
      padding: 20px 23px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(110deg, rgba(29, 27, 39, .98), rgba(27, 25, 36, .96));
      color: inherit;
      text-decoration: none;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .link-card:hover, .link-card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--purple-soft);
      background: var(--card-hover);
      outline: none;
    }
    .link-card h2 { margin: 0 0 6px; color: var(--purple); font-size: 18px; font-weight: 750; }
    .link-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .arrow { float: right; color: var(--purple); font-size: 20px; margin-left: 10px; }
    footer { margin-top: 30px; color: #777180; text-align: center; font-size: 12px; }
    @media (max-width: 420px) {
      main { width: min(100% - 24px, 590px); padding-top: 26px; }
      .link-card { padding: 17px 18px; }
      .link-card h2 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <!-- Replace "FM" with an image if you have a logo. -->
      <div class="logo" aria-label="Frosty's Modding logo">FM</div>
      <h1>Frosty's Modding</h1>
      <p class="subtitle">VR Mods · Releases · Community</p>
    </header>

    <section class="links" aria-label="Links">
      <!-- Replace each # with your real invite, release, or project URL. -->
      <a class="link-card" href="#" target="_blank" rel="noopener noreferrer">
        <span class="arrow" aria-hidden="true">↗</span>
        <h2>Discord Server</h2>
        <p>Join the community</p>
      </a>
      <a class="link-card" href="#" target="_blank" rel="noopener noreferrer">
        <span class="arrow" aria-hidden="true">↗</span>
        <h2>Gorilla Tag Mods</h2>
        <p>Project information and releases</p>
      </a>
      <a class="link-card" href="#" target="_blank" rel="noopener noreferrer">
        <span class="arrow" aria-hidden="true">↗</span>
        <h2>Animal Company VR</h2>
        <p>Project information and updates</p>
      </a>
      <a class="link-card" href="#" target="_blank" rel="noopener noreferrer">
        <span class="arrow" aria-hidden="true">↗</span>
        <h2>Latest Releases</h2>
        <p>See new projects and changelogs</p>
      </a>
    </section>

    <footer>Made by Frosty's Modding</footer>
  </main>
</body>
</html>
